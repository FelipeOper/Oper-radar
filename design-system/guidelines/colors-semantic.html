<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px 28px}.lbl{font:var(--type-caption);color:var(--text-tertiary)}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.nm{font:600 12px/1.2 var(--font-sans)}.hx{font:11px/1.2 var(--font-sans);color:var(--text-tertiary);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-pill);background:var(--success-soft);color:var(--success-text);font:600 12px/1 var(--font-sans)"><span style="width:8px;height:8px;border-radius:50%;background:var(--success)"></span>Success</div><div class="hx">--success · --success-soft · --success-text</div></div><div class="sw"><div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-pill);background:var(--warning-soft);color:var(--warning-text);font:600 12px/1 var(--font-sans)"><span style="width:8px;height:8px;border-radius:50%;background:var(--warning)"></span>Warning</div><div class="hx">--warning · --warning-soft · --warning-text</div></div><div class="sw"><div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-pill);background:var(--danger-soft);color:var(--danger-text);font:600 12px/1 var(--font-sans)"><span style="width:8px;height:8px;border-radius:50%;background:var(--danger)"></span>Danger</div><div class="hx">--danger · --danger-soft · --danger-text</div></div><div class="sw"><div style="display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-pill);background:var(--info-soft);color:var(--info-text);font:600 12px/1 var(--font-sans)"><span style="width:8px;height:8px;border-radius:50%;background:var(--info)"></span>Info</div><div class="hx">--info · --info-soft · --info-text</div></div></div></body></html>
