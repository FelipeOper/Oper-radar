<!-- @dsCard group="Spacing" viewport="700x140" name="Motion" subtitle="Quiet, fast ease-out; radar sweep = live" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px 28px}.lbl{font:var(--type-caption);color:var(--text-tertiary)}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.nm{font:600 12px/1.2 var(--font-sans)}.hx{font:11px/1.2 var(--font-sans);color:var(--text-tertiary);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="align-items:center;gap:28px"><div style="position:relative;width:72px;height:72px;border-radius:50%;border:1px solid var(--accent-soft-strong);overflow:hidden"><div style="position:absolute;inset:0;background:conic-gradient(from 0deg,transparent 0 290deg,rgba(70,248,75,.55) 360deg);animation:or-sweep var(--dur-sweep) linear infinite;border-radius:50%"></div><div style="position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--accent)"></div></div><div style="display:flex;flex-direction:column;gap:6px"><div class="nm">--ease-out cubic-bezier(.2,.8,.2,1)</div><div class="hx">instant 80 · fast 140 · base 200 · slow 320 · sweep 4s</div><div class="hx">Hover = surface step; press = accent-press; reduced-motion respected</div></div></div></body></html>
