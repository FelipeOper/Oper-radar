<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px 28px}.lbl{font:var(--type-caption);color:var(--text-tertiary)}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.nm{font:600 12px/1.2 var(--font-sans)}.hx{font:11px/1.2 var(--font-sans);color:var(--text-tertiary);font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--bg-app);border-color:var(--border-default)"></div><div class="nm">bg-app</div></div><div class="sw"><div class="chip" style="background:var(--surface-1);border-color:var(--border-default)"></div><div class="nm">surface-1</div></div><div class="sw"><div class="chip" style="background:var(--surface-2);border-color:var(--border-default)"></div><div class="nm">surface-2</div></div><div class="sw"><div class="chip" style="background:var(--surface-3);border-color:var(--border-default)"></div><div class="nm">surface-3</div></div><div class="sw"><div class="chip" style="background:var(--surface-inverse);border-color:var(--border-default)"></div><div class="nm">surface-inverse</div></div></div><div class="row" style="margin-top:14px;gap:18px"><span style="color:var(--text-primary);font:600 14px/1 var(--font-sans)">Primary</span><span style="color:var(--text-secondary);font:600 14px/1 var(--font-sans)">Secondary</span><span style="color:var(--text-tertiary);font:600 14px/1 var(--font-sans)">Tertiary</span><span style="color:var(--text-accent);font:600 14px/1 var(--font-sans)">Accent</span><span style="color:var(--text-disabled);font:600 14px/1 var(--font-sans)">Disabled</span></div></body></html>
