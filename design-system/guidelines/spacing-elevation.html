<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px 28px}.lbl{font:var(--type-caption);color:var(--text-tertiary)}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.nm{font:600 12px/1.2 var(--font-sans)}.hx{font:11px/1.2 var(--font-sans);color:var(--text-tertiary);font-variant-numeric:tabular-nums}</style></head><body data-theme="light" style="padding:32px"><div class="row" style="gap:20px"><div class="sw" style="align-items:center"><div style="width:100%;height:84px;background:var(--surface-1);border-radius:var(--radius-lg);box-shadow:var(--shadow-none)"></div><div class="nm">shadow-none</div></div><div class="sw" style="align-items:center"><div style="width:100%;height:84px;background:var(--surface-1);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></div><div class="nm">shadow-sm</div></div><div class="sw" style="align-items:center"><div style="width:100%;height:84px;background:var(--surface-1);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"></div><div class="nm">shadow-md</div></div><div class="sw" style="align-items:center"><div style="width:100%;height:84px;background:var(--surface-1);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><div class="nm">shadow-lg</div></div><div class="sw" style="align-items:center"><div style="width:100%;height:84px;background:var(--surface-1);border-radius:var(--radius-lg);box-shadow:var(--shadow-float)"></div><div class="nm">shadow-float</div></div></div></body></html>
