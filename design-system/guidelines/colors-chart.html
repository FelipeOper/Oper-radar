<!-- @dsCard group="Colors" viewport="700x150" name="Chart series" subtitle="Ordered — series 1 is always radar green" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px 28px}.lbl{font:var(--type-caption);color:var(--text-tertiary)}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.chip{height:64px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}.nm{font:600 12px/1.2 var(--font-sans)}.hx{font:11px/1.2 var(--font-sans);color:var(--text-tertiary);font-variant-numeric:tabular-nums}</style></head><body><div class="row" style="align-items:flex-end;height:80px;gap:14px"><div class="sw" style="justify-content:flex-end;height:100%"><div style="height:80%;background:var(--chart-1);border-radius:8px 8px 3px 3px"></div></div><div class="sw" style="justify-content:flex-end;height:100%"><div style="height:62%;background:var(--chart-2);border-radius:8px 8px 3px 3px"></div></div><div class="sw" style="justify-content:flex-end;height:100%"><div style="height:48%;background:var(--chart-3);border-radius:8px 8px 3px 3px"></div></div><div class="sw" style="justify-content:flex-end;height:100%"><div style="height:36%;background:var(--chart-4);border-radius:8px 8px 3px 3px"></div></div><div class="sw" style="justify-content:flex-end;height:100%"><div style="height:26%;background:var(--chart-5);border-radius:8px 8px 3px 3px"></div></div></div><div class="row" style="gap:14px;margin-top:8px"><div class="sw"><div class="hx">--chart-1</div></div><div class="sw"><div class="hx">--chart-2</div></div><div class="sw"><div class="hx">--chart-3</div></div><div class="sw"><div class="hx">--chart-4</div></div><div class="sw"><div class="hx">--chart-5</div></div></div></body></html>
